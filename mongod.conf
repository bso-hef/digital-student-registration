# MongoDB Configuration File for Production
# Digital Student Registration System
# Optimized for Docker deployment on VPS/self-hosted environments

# Network settings
net:
  port: 27017
  bindIp: 0.0.0.0
  # Enable IPv6
  ipv6: false
  # Maximum number of simultaneous connections
  maxIncomingConnections: 200

# Storage settings
storage:
  # Database file location (mounted as Docker volume)
  dbPath: /data/db
  journal:
    # Enable journaling for durability
    enabled: true
    # Commit interval in milliseconds (default: 100ms)
    commitIntervalMs: 100
  # Storage engine (WiredTiger is default and recommended)
  engine: wiredtiger
  wiredTiger:
    engineConfig:
      # Cache size: 50% of available RAM (Docker will limit this)
      # For 1GB RAM limit, this will be ~512MB
      cacheSizeGB: 0.5
      # Journal compression
      journalCompressor: snappy
    collectionConfig:
      # Block compression for collections
      blockCompressor: snappy
    indexConfig:
      # Prefix compression for indexes
      prefixCompression: true

# Operation profiling for performance monitoring
operationProfiling:
  # 0 = off, 1 = slow operations, 2 = all operations
  mode: slowOp
  # Threshold for slow operations (milliseconds)
  slowOpThresholdMs: 100
  # Sample rate for profiling (1.0 = 100%, 0.5 = 50%)
  slowOpSampleRate: 1.0

# Security settings
security:
  # Authorization: require authentication
  authorization: enabled
  # JavaScript execution (disable for security if not needed)
  javascriptEnabled: true

# Logging settings
systemLog:
  # Log destination (stdout for Docker logs)
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  # Verbosity level (0-5, 0 = default)
  verbosity: 0
  component:
    accessControl:
      verbosity: 0
    command:
      verbosity: 0
    # Log slow queries for debugging
    query:
      verbosity: 1
    write:
      verbosity: 0
    index:
      verbosity: 0
    storage:
      verbosity: 0
    replication:
      verbosity: 0

# Process management
processManagement:
  # Fork server process (not needed in Docker)
  fork: false
  # PID file location
  pidFilePath: /var/run/mongodb/mongod.pid

# Replication (for future cluster setup)
# Uncomment and configure for replica sets
# replication:
#   replSetName: "rs0"

# Sharding (for future horizontal scaling)
# Uncomment and configure for sharded clusters
# sharding:
#   clusterRole: shardsvr

# Set parameter options
setParameter:
  # Enable diagnostic data collection
  diagnosticDataCollectionEnabled: true
  # Connection pool size per host
  connPoolMaxShardedConnsPerHost: 200
  connPoolMaxConnsPerHost: 200
  # Reduce timeout for faster failure detection
  cursorTimeoutMillis: 600000

# Performance tuning
# Note: These are optimized for small to medium deployments
# Adjust based on your workload and hardware

# Index build memory limit (MB)
# Uncomment to limit memory usage during index builds
# indexBuildMemoryLimit: 200
