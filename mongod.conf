# MongoDB Configuration for Production (Docker)
# Optimized for container deployment - logs to stdout

net:
  port: 27017
  bindIp: 0.0.0.0
  ipv6: false
  maxIncomingConnections: 200

storage:
  dbPath: /data/db
  journal:
    enabled: true
    commitIntervalMs: 100
  engine: wiredtiger
  wiredTiger:
    engineConfig:
      # No cacheSizeGB - let Mongo 7.0 auto-detect cgroup memory limits
      journalCompressor: snappy
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Profiling disabled by default - enable temporarily for debugging
operationProfiling:
  mode: off

security:
  authorization: enabled
  # Disable server-side JS unless mapReduce is explicitly needed
  javascriptEnabled: false

# No systemLog block - MongoDB defaults to stdout (container best practice)

processManagement:
  fork: false

setParameter:
  # Diagnostic data collection disabled for production overhead reduction
  diagnosticDataCollectionEnabled: false
  connPoolMaxShardedConnsPerHost: 200
  connPoolMaxConnsPerHost: 200
  cursorTimeoutMillis: 600000
