# Docker Compose Windows Configuration
# Digital Student Registration System
#
# This configuration is for running on Windows with Docker Desktop (WSL2 backend).
# All containers run as Linux containers via WSL2 - this is the modern default.
#
# Prerequisites:
#   1. Windows 10/11 with Docker Desktop installed
#   2. WSL2 backend enabled (default for Docker Desktop)
#   3. Copy .env.production.template to .env and configure
#
# Usage:
#   docker-compose -f docker-compose.windows.yml up -d
#
# Note: For most Windows users, the main docker-compose.yml works fine.
# Use this file only if you need Windows-specific settings (host paths, etc.)

services:
  # ============================================
  # Next.js Application Server
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: digital-student-registration:windows
    container_name: dsr-windows-app
    restart: unless-stopped
    ports:
      # Expose directly on port 3000 (no Caddy reverse proxy)
      - "3000:3000"
    environment:
      # Node.js environment
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1

      # Application URLs (localhost for Windows dev)
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

      # Database connection
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongo:27017/${MONGO_DB:-digital-student-registration}?authSource=admin
      MONGO_USER: ${MONGO_USER:-admin}
      MONGO_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_DB: ${MONGO_DB:-digital-student-registration}

      # Redis connection
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      REDIS_DB: 0
      REDIS_KEY_PREFIX: "dsr:windows:"

      # NextAuth configuration
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-windows-dev-secret-change-in-production-min-64-chars}

      # Application info
      NEXT_PUBLIC_VERSION: ${APP_VERSION:-1.0.0}
      NEXT_PUBLIC_NAME: ${APP_NAME:-Digital Student Registration}
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.docker.compose.project=digital-student-registration-windows"
      - "com.docker.compose.service=app"

  # ============================================
  # MongoDB Database
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: dsr-windows-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-digital-student-registration}
    volumes:
      - mongo-windows-data:/data/db
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok", "--username", "${MONGO_USER:-admin}", "--password", "${MONGO_PASSWORD:-admin123}", "--authenticationDatabase", "admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.docker.compose.project=digital-student-registration-windows"
      - "com.docker.compose.service=mongo"

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: dsr-windows-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis123}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
    volumes:
      - redis-windows-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    labels:
      - "com.docker.compose.project=digital-student-registration-windows"
      - "com.docker.compose.service=redis"

# ============================================
# Networks
# ============================================
networks:
  app-network:
    driver: bridge
    name: dsr-windows-network

# ============================================
# Volumes (Persistent Storage)
# ============================================
volumes:
  mongo-windows-data:
    driver: local
    name: dsr-windows-mongo-data

  redis-windows-data:
    driver: local
    name: dsr-windows-redis-data

# ============================================
# Notes for Windows Users
# ============================================
#
# 1. Docker Desktop with WSL2:
#    - This is the default and recommended setup
#    - All containers run as Linux containers via WSL2
#    - No special configuration needed
#
# 2. Accessing Services:
#    - Application: http://localhost:3000
#    - MongoDB:     mongodb://admin:admin123@localhost:27017
#    - Redis:       redis://localhost:6379 (password: redis123)
#
# 3. Windows Firewall:
#    - Docker Desktop usually configures firewall automatically
#    - If ports aren't accessible, check Windows Firewall settings
#
# 4. Performance:
#    - WSL2 provides near-native Linux performance
#    - For best results, store project files in WSL2 filesystem
#    - Access via: \\wsl$\Ubuntu\home\your-user\projects
#
# 5. Alternative - Using Host MongoDB:
#    If you have MongoDB installed on Windows:
#    - Comment out the mongo service above
#    - Change MONGODB_URI to: mongodb://host.docker.internal:27017/...
#
# Commands:
#   Start:  docker-compose -f docker-compose.windows.yml up -d
#   Stop:   docker-compose -f docker-compose.windows.yml down
#   Logs:   docker-compose -f docker-compose.windows.yml logs -f
#   Clean:  docker-compose -f docker-compose.windows.yml down -v
