<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100">
  <defs>
    <marker id="arrow-atomic" markerWidth="5" markerHeight="4" refX="5" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 z" fill="#515053"/>
    </marker>
  </defs>

  <!-- Atoms -->
  <text x="50" y="25" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">(Button, Input)</text>
  <rect x="10" y="35" width="80" height="40" rx="4" fill="#E74C3C"/>
  <text x="50" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Atoms</text>

  <line x1="90" y1="55" x2="130" y2="55" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-atomic)"/>

  <!-- Molecules -->
  <text x="175" y="25" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">(Header, Menu)</text>
  <rect x="133" y="35" width="84" height="40" rx="4" fill="#F39C12"/>
  <text x="175" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Molecules</text>

  <line x1="217" y1="55" x2="260" y2="55" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-atomic)"/>

  <!-- Organisms -->
  <text x="305" y="25" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">(DataTable, Forms)</text>
  <rect x="260" y="35" width="90" height="40" rx="4" fill="#27AE60"/>
  <text x="305" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Organisms</text>

  <line x1="350" y1="55" x2="392" y2="55" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-atomic)"/>

  <!-- Pages -->
  <text x="445" y="25" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">(Admin, Student)</text>
  <rect x="393" y="35" width="104" height="40" rx="4" fill="#4DBFC3"/>
  <text x="445" y="60" fill="#fff" font-family="Inter, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pages</text>
</svg>
