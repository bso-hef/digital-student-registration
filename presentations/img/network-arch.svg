<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120">
  <defs>
    <marker id="arrow-net" markerWidth="5" markerHeight="4" refX="0" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 z" fill="#515053"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text x="50" y="18" fill="#515053" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Client</text>
  <text x="200" y="18" fill="#515053" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Server</text>
  <text x="430" y="18" fill="#515053" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Datenbanken</text>

  <!-- Browser -->
  <rect x="10" y="28" width="80" height="50" rx="4" fill="#515053"/>
  <text x="50" y="50" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Browser</text>
  <text x="50" y="66" fill="#D8DFE0" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">HTTPS</text>

  <line x1="90" y1="53" x2="105" y2="53" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-net)"/>

  <!-- Next.js App -->
  <rect x="110" y="28" width="180" height="50" rx="4" fill="#4DBFC3"/>
  <text x="200" y="50" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Next.js App :3000</text>
  <text x="200" y="66" fill="#D1F3F4" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">API + SSR</text>

  <line x1="290" y1="53" x2="305" y2="53" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-net)"/>

  <!-- MongoDB -->
  <rect x="310" y="28" width="115" height="50" rx="4" fill="#27AE60"/>
  <text x="367" y="50" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">MongoDB</text>
  <text x="367" y="66" fill="#D5F5E3" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">:27017</text>

  <!-- Redis -->
  <rect x="435" y="28" width="115" height="50" rx="4" fill="#E74C3C"/>
  <text x="492" y="50" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Redis</text>
  <text x="492" y="66" fill="#FADBD8" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">:6379</text>

  <!-- Verbindungslinie App zu Redis -->
  <line x1="200" y1="78" x2="200" y2="95.75" stroke="#515053" stroke-width="1.5"/>
  <line x1="200" y1="95" x2="487" y2="95" stroke="#515053" stroke-width="1.5"/>
  <line x1="487" y1="95.75" x2="487" y2="80" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-net)"/>

  <!-- Beschriftungen unten -->
  <text x="367" y="110" fill="#27AE60" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Datenbank</text>
  <text x="492" y="110" fill="#E74C3C" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Sessions</text>
</svg>
