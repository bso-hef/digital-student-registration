<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 100">
  <defs>
    <marker id="arrow-deploy" markerWidth="5" markerHeight="4" refX="0" refY="2" orient="auto">
      <path d="M0,0 L5,2 L0,4 z" fill="#515053"/>
    </marker>
  </defs>

  <!-- Step 1: .env -->
  <rect x="10" y="25" width="90" height="50" rx="4" fill="#F39C12"/>
  <text x="55" y="45" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">.env</text>
  <text x="55" y="62" fill="#FEF5E7" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Konfiguration</text>

  <line x1="100" y1="50" x2="115" y2="50" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-deploy)"/>

  <!-- Step 2: script.sh -->
  <rect x="120" y="25" width="90" height="50" rx="4" fill="#515053"/>
  <text x="165" y="45" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">script.sh</text>
  <text x="165" y="62" fill="#D8DFE0" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Build starten</text>

  <line x1="210" y1="50" x2="225" y2="50" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-deploy)"/>

  <!-- Step 3: Dockerfile -->
  <rect x="230" y="25" width="90" height="50" rx="4" fill="#4DBFC3"/>
  <text x="275" y="45" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Dockerfile</text>
  <text x="275" y="62" fill="#D1F3F4" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Image bauen</text>

  <line x1="320" y1="50" x2="335" y2="50" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-deploy)"/>

  <!-- Step 4: Image -->
  <rect x="340" y="25" width="90" height="50" rx="4" fill="#5AA5A7"/>
  <text x="385" y="45" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Image</text>
  <text x="385" y="62" fill="#D1F3F4" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Artefakt</text>

  <line x1="430" y1="50" x2="445" y2="50" stroke="#515053" stroke-width="1.5" marker-end="url(#arrow-deploy)"/>

  <!-- Step 5: Compose -->
  <rect x="450" y="25" width="100" height="50" rx="4" fill="#27AE60"/>
  <text x="500" y="45" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">compose up</text>
  <text x="500" y="62" fill="#D5F5E3" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Läuft</text>
</svg>
