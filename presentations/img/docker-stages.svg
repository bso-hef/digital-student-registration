<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 110">
  <defs>
    <marker id="arrow-docker" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#4DBFC3"/>
    </marker>
  </defs>

  <!-- Stage 1: BASE -->
  <rect x="10" y="15" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>
  <text x="60" y="38" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="700">1: BASE</text>
  <text x="60" y="53" fill="#515053" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">node:alpine</text>
  <text x="60" y="78" fill="#27AE60" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">22MB</text>

  <line x1="110" y1="40" x2="150" y2="40" stroke="#4DBFC3" stroke-width="2" marker-end="url(#arrow-docker)"/>

  <!-- Stage 2: DEPS -->
  <rect x="158" y="15" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>
  <text x="208" y="38" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="700">2: DEPS</text>
  <text x="208" y="53" fill="#515053" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">yarn install</text>
  <text x="208" y="78" fill="#F39C12" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">800MB</text>

  <line x1="258" y1="40" x2="298" y2="40" stroke="#4DBFC3" stroke-width="2" marker-end="url(#arrow-docker)"/>

  <!-- Stage 3: BUILD -->
  <rect x="306" y="15" width="100" height="50" rx="6" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>
  <text x="356" y="38" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="700">3: BUILD</text>
  <text x="356" y="53" fill="#515053" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">yarn build</text>
  <text x="356" y="78" fill="#E74C3C" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">1.2GB</text>

  <line x1="406" y1="40" x2="446" y2="40" stroke="#4DBFC3" stroke-width="2" marker-end="url(#arrow-docker)"/>

  <!-- Stage 4: RUNNER -->
  <rect x="454" y="15" width="86" height="50" rx="6" fill="#D1F3F4" stroke="#4DBFC3" stroke-width="2"/>
  <text x="497" y="38" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="700">4: RUNNER</text>
  <text x="497" y="53" fill="#515053" font-family="Inter, sans-serif" font-size="9" text-anchor="middle" font-weight="600">node server.js</text>
  <text x="497" y="78" fill="#27AE60" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">150MB</text>

  <!-- Reduction badge -->
  <rect x="454" y="90" width="86" height="18" rx="4" fill="#27AE60"/>
  <text x="497" y="102" fill="#fff" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="700">90% kleiner!</text>
</svg>
