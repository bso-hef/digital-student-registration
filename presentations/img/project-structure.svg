<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120">
  <!-- src/ Header -->
  <text x="10" y="18" fill="#4DBFC3" font-family="monospace" font-size="14" font-weight="700">src/</text>

  <!-- Row 1: app, components, store -->
  <rect x="10" y="28" width="170" height="38" rx="4" fill="#4DBFC3"/>
  <text x="95" y="44" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">app/</text>
  <text x="95" y="58" fill="#D1F3F4" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Pages + API Routes</text>

  <rect x="195" y="28" width="170" height="38" rx="4" fill="#5AA5A7"/>
  <text x="280" y="44" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">components/</text>
  <text x="280" y="58" fill="#D1F3F4" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Atomic Design</text>

  <rect x="380" y="28" width="170" height="38" rx="4" fill="#82D7DA"/>
  <text x="465" y="44" fill="#282829" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">store/</text>
