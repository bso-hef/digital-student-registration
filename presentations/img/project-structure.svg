<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 185">
  <!-- src folder -->
  <text x="20" y="22" fill="#4DBFC3" font-family="monospace" font-size="13" font-weight="700">src/</text>

  <!-- app folder -->
  <text x="40" y="50" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- app/</text>
  <rect x="130" y="36" width="210" height="22" rx="3" fill="#D1F3F4"/>
  <text x="140" y="52" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" font-weight="600">Next.js Pages + API Routes</text>

  <!-- components folder -->
  <text x="40" y="78" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- components/</text>
  <rect x="175" y="64" width="165" height="22" rx="3" fill="#D1F3F4"/>
  <text x="185" y="80" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" font-weight="600">atoms/, molecules/, organisms/</text>

  <!-- store folder -->
  <text x="40" y="106" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- store/</text>
  <rect x="130" y="92" width="190" height="22" rx="3" fill="#D1F3F4"/>
  <text x="140" y="108" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" font-weight="600">Redux: actions/, reducers/</text>

  <!-- models folder -->
  <text x="40" y="134" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- models/</text>
  <rect x="145" y="120" width="190" height="22" rx="3" fill="#D1F3F4"/>
  <text x="155" y="136" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" font-weight="600">Mongoose: Student, Class</text>

  <!-- lib folder -->
  <text x="40" y="162" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- lib/</text>
  <rect x="110" y="148" width="230" height="22" rx="3" fill="#D1F3F4"/>
  <text x="120" y="164" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" font-weight="600">services/, config/, validate/</text>

  <!-- theme folder -->
  <text x="40" y="185" fill="#515053" font-family="monospace" font-size="12" font-weight="600">+-- theme/</text>
</svg>
