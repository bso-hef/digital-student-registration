  <text x="95" y="106" fill="#FEF5E7" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Mongoose Schemas</text>

  <rect x="195" y="76" width="170" height="38" rx="4" fill="#27AE60"/>
  <text x="280" y="92" fill="#fff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">lib/</text>
  <text x="280" y="106" fill="#D5F5E3" font-family="Inter, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Services + Config</text>

  <rect x="380" y="76" width="170" height="38" rx="4" fill="#515053"/>
