<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <!-- Outer container -->
  <rect x="10" y="10" width="380" height="140" rx="8" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>

  <!-- KPI Row -->
  <rect x="20" y="20" width="85" height="38" rx="4" fill="#D1F3F4" stroke="#4DBFC3" stroke-width="2"/>
  <text x="62" y="44" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">KPI</text>

  <rect x="115" y="20" width="85" height="38" rx="4" fill="#D1F3F4" stroke="#4DBFC3" stroke-width="2"/>
  <text x="157" y="44" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">KPI</text>

  <rect x="210" y="20" width="85" height="38" rx="4" fill="#D1F3F4" stroke="#4DBFC3" stroke-width="2"/>
  <text x="252" y="44" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">KPI</text>

  <rect x="305" y="20" width="75" height="38" rx="4" fill="#D1F3F4" stroke="#4DBFC3" stroke-width="2"/>
  <text x="342" y="44" fill="#4DBFC3" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="700">KPI</text>

  <!-- Drag + Drop label -->
  <text x="360" y="15" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600">(Drag + Drop)</text>

  <!-- DataTable -->
  <rect x="20" y="68" width="360" height="52" rx="4" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>
  <text x="200" y="90" fill="#515053" font-family="Inter, sans-serif" font-size="12" text-anchor="middle" font-weight="700">DataTable</text>
  <text x="200" y="107" fill="#515053" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">(Filter, Sort, Pagination)</text>

  <!-- Activity Feed -->
  <rect x="20" y="128" width="360" height="18" rx="4" fill="#FFFFFF" stroke="#D8DFE0" stroke-width="2"/>
  <text x="200" y="141" fill="#515053" font-family="Inter, sans-serif" font-size="10" text-anchor="middle" font-weight="600">Activity Feed (Auto-Refresh)</text>
</svg>
