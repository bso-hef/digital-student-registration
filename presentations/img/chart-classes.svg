<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Vertikales Balkendiagramm - 1 Balken pro Klasse -->

  <!-- Balken (von unten nach oben) -->
  <rect x="10" y="25" width="16" height="60" rx="2" fill="#667eea"/>
  <rect x="30" y="35" width="16" height="50" rx="2" fill="#4fc3f7"/>
  <rect x="50" y="20" width="16" height="65" rx="2" fill="#764ba2"/>
  <rect x="70" y="40" width="16" height="45" rx="2" fill="#11998e"/>
  <rect x="90" y="30" width="16" height="55" rx="2" fill="#38ef7d"/>
  <rect x="110" y="45" width="16" height="40" rx="2" fill="#f093fb"/>
  <rect x="130" y="50" width="16" height="35" rx="2" fill="#f5576c"/>
  <rect x="150" y="55" width="16" height="30" rx="2" fill="#F39C12"/>
  <rect x="170" y="65" width="16" height="20" rx="2" fill="#7B7A7E"/>

  <!-- X-Achse Labels (Klassen) -->
  <text x="18" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">5</text>
  <text x="38" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">6</text>
  <text x="58" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">7</text>
  <text x="78" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">8</text>
  <text x="98" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">9</text>
  <text x="118" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">10</text>
  <text x="138" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">11</text>
  <text x="158" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">12</text>
  <text x="178" y="95" fill="#515053" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">13</text>

  <!-- Y-Achse -->
  <line x1="5" y1="85" x2="195" y2="85" stroke="#D8DFE0" stroke-width="1"/>

  <!-- Y-Achse Werte -->
  <text x="3" y="88" fill="#7B7A7E" font-family="Inter, sans-serif" font-size="6">0</text>
  <text x="3" y="18" fill="#7B7A7E" font-family="Inter, sans-serif" font-size="6">50</text>
</svg>
