<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <!-- Tortendiagramm für Schülerstatus - 3 Segmente -->
  <g transform="translate(50, 50)">
    <!-- Importiert - Blau (35%) -->
    <circle r="30" fill="transparent" stroke="#667eea" stroke-width="28"
      stroke-dasharray="66 188.5" stroke-dashoffset="0" transform="rotate(-90)"/>
    <!-- Eingeladen - Orange (25%) -->
    <circle r="30" fill="transparent" stroke="#F39C12" stroke-width="28"
      stroke-dasharray="47 188.5" stroke-dashoffset="-66" transform="rotate(-90)"/>
    <!-- Onboarded - Grün (40%) -->
    <circle r="30" fill="transparent" stroke="#27AE60" stroke-width="28"
      stroke-dasharray="75.4 188.5" stroke-dashoffset="-113" transform="rotate(-90)"/>
  </g>

  <!-- Legende mit Prozent -->
  <g transform="translate(100, 18)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="#667eea"/>
    <text x="16" y="10" fill="#515053" font-family="Inter, sans-serif" font-size="9">Importiert</text>
    <text x="80" y="10" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600">35%</text>

    <rect x="0" y="22" width="12" height="12" rx="2" fill="#F39C12"/>
    <text x="16" y="32" fill="#515053" font-family="Inter, sans-serif" font-size="9">Eingeladen</text>
    <text x="80" y="32" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600">25%</text>

    <rect x="0" y="44" width="12" height="12" rx="2" fill="#27AE60"/>
    <text x="16" y="54" fill="#515053" font-family="Inter, sans-serif" font-size="9">Onboarded</text>
    <text x="80" y="54" fill="#515053" font-family="Inter, sans-serif" font-size="9" font-weight="600">40%</text>
  </g>
</svg>
