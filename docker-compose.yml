# Production Docker Compose
# Digital Student Registration System
#
# Optimized deployment for Linux and Windows production environments
# - No reverse proxy (direct port exposure)
# - HTTP only (add external SSL layer if needed)
# - Single network, minimal configuration
# - Resource limits and security hardening
#
# Prerequisites:
#   1. Build the Docker image first:
#      Linux:   ./scripts/docker-build.sh
#      Windows: .\scripts\docker-build.ps1
#
#   2. Copy .env.example to .env and configure required values:
#      cp .env.example .env  (then edit .env with your secrets)
#
#   3. Ensure configured port is available (default: 3000)
#
# Usage:
#   Linux:   docker compose --profile linux up -d
#   Windows: docker compose --profile windows up -d
#
# External SSL Setup:
#   Add nginx, Cloudflare, or cloud load balancer in front for HTTPS

services:
  # ============================================
  # Next.js Application Server (Linux)
  # ============================================
  app-linux:
    profiles:
      - linux
    image: ${DOCKER_IMAGE:-dsr-app}:${APP_VERSION:-2.1.0}
    container_name: dsr-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-digital-student-registration}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_VERSION: ${APP_VERSION:-2.1.0}
      NEXT_PUBLIC_NAME: ${APP_NAME:-Digital Student Registration}
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${APP_PORT:-3000}/api/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================
  # Next.js Application Server (Windows)
  # ============================================
  app-windows:
    profiles:
      - windows
    image: ${DOCKER_IMAGE:-dsr-app}:${APP_VERSION:-2.1.0}-windows
    container_name: dsr-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${APP_PORT:-3000}
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB:-digital-student-registration}?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_VERSION: ${APP_VERSION:-2.1.0}
      NEXT_PUBLIC_NAME: ${APP_NAME:-Digital Student Registration}
    networks:
      - app-network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================
  # MongoDB Database
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: dsr-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-digital-student-registration}
    volumes:
      - mongo-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    networks:
      - app-network
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" --username \"$MONGO_INITDB_ROOT_USERNAME\" --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # Redis Cache (for session storage and caching)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: dsr-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

# ============================================
# Networks
# ============================================
networks:
  app-network:
    driver: bridge
    name: dsr-network

# ============================================
# Volumes (persistent data storage)
# ============================================
volumes:
  mongo-data:
    driver: local
    name: dsr-mongo-data

  redis-data:
    driver: local
    name: dsr-redis-data
