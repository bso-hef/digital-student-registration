# Docker Compose configuration for DEVELOPMENT
# This setup includes hot-reload, debugging, and development tools

version: '3.9'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: digital-student-mongo-dev
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-devpassword123}
      MONGO_INITDB_DATABASE: digital-student-onboarding
    volumes:
      # Persist database data
      - mongo_data_dev:/data/db
      # Persist MongoDB configuration
      - mongo_config_dev:/data/configdb
    networks:
      - student_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Next.js Application Service (Development Mode)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: digital-student-app-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Node environment
      NODE_ENV: development

      # MongoDB connection
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-devpassword123}@mongo:27017/digital-student-onboarding?authSource=admin

      # NextAuth configuration
      NEXTAUTH_URL: https://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production-min-64-chars-required-for-jwt}

      # API URL
      NEXT_PUBLIC_API_URL: https://localhost:3000

      # Application info
      NEXT_PUBLIC_VERSION: ${npm_package_version:-1.0.0}
      NEXT_PUBLIC_NAME: ${npm_package_name:-digital-student-registration}

      # Development settings
      NEXT_TELEMETRY_DISABLED: 1
    volumes:
      # Mount source code for hot-reload
      - .:/app
      - /app/node_modules
      - /app/.next

      # Mount SSL certificates for HTTPS development
      - ./certificates:/app/certificates:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - student_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health/live', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Development: run in watch mode
    command: yarn dev

  # MongoDB Express - Web-based MongoDB admin interface (Development only)
  mongo-express:
    image: mongo-express:1.0.2
    container_name: digital-student-mongo-express
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-devpassword123}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-devpassword123}@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-pass}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - student_network

volumes:
  mongo_data_dev:
    name: digital_student_mongo_data_dev
  mongo_config_dev:
    name: digital_student_mongo_config_dev

networks:
  student_network:
    name: digital_student_network_dev
    driver: bridge
