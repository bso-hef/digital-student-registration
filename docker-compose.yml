# Docker Compose Configuration for Production
# Digital Student Registration System
#
# Production-ready deployment with:
# - Caddy reverse proxy with automatic Let's Encrypt SSL
# - Next.js application server
# - MongoDB database with persistence
# - Redis cache for performance
#
# Usage:
#   docker-compose up -d
#
# Prerequisites:
#   1. Copy .env.production.template to .env and configure all values
#   2. Ensure domain DNS points to your server
#   3. Open ports 80 and 443 on your firewall
#
# Development:
#   Use `yarn dev` locally for development (no Docker needed)

services:
  # ============================================
  # Caddy Reverse Proxy
  # ============================================
  caddy:
    image: caddy:2.9-alpine
    container_name: dsr-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    networks:
      - frontend
      - proxy
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.docker.compose.project=digital-student-registration"
      - "com.docker.compose.service=caddy"

  # ============================================
  # Next.js Application Server
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: digital-student-registration:latest
    container_name: dsr-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: https://${DOMAIN}
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      MONGO_USER: ${MONGO_USER}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      MONGO_DB: ${MONGO_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: 0
      REDIS_KEY_PREFIX: "dsr:"
      NEXTAUTH_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_VERSION: ${APP_VERSION:-1.0.0}
      NEXT_PUBLIC_NAME: ${APP_NAME:-Digital Student Registration}
    networks:
      - proxy
      - backend
    depends_on:
      - mongo
      - redis
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "com.docker.compose.project=digital-student-registration"
      - "com.docker.compose.service=app"

  # ============================================
  # MongoDB Database
  # ============================================
  mongo:
    image: mongo:7.0
    container_name: dsr-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    volumes:
      - mongo-data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    networks:
      - backend
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" --username \"$MONGO_USER\" --password \"$MONGO_PASSWORD\" --authenticationDatabase admin || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    mem_limit: 1g
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.docker.compose.project=digital-student-registration"
      - "com.docker.compose.service=mongo"

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: dsr-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel warning
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    labels:
      - "com.docker.compose.project=digital-student-registration"
      - "com.docker.compose.service=redis"

networks:
  frontend:
    driver: bridge
    name: dsr-frontend

  proxy:
    driver: bridge
    name: dsr-proxy

  backend:
    driver: bridge
    name: dsr-backend

volumes:
  caddy-data:
    driver: local
    name: dsr-caddy-data

  caddy-config:
    driver: local
    name: dsr-caddy-config

  caddy-logs:
    driver: local
    name: dsr-caddy-logs

  mongo-data:
    driver: local
    name: dsr-mongo-data

  redis-data:
    driver: local
    name: dsr-redis-data
