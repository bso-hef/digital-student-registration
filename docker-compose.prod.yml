# Docker Compose configuration for PRODUCTION
# Optimized for performance, security, and reliability
# Use with: docker-compose -f docker-compose.prod.yml up -d

version: "3.9"

services:
  # MongoDB Database Service (Production)
  mongo:
    image: mongo:7.0
    container_name: digital-student-mongo-prod
    restart: always
    ports:
      # Only expose MongoDB on localhost for security
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: digital-student-onboarding
    volumes:
      # Persist database data
      - mongo_data_prod:/data/db
      # Persist MongoDB configuration
      - mongo_config_prod:/data/configdb
      # Optional: Mount custom MongoDB configuration
      # - ./mongo/mongod.conf:/etc/mongod.conf:ro
    networks:
      - student_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    # Production: Set resource limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    # Production: Enable logging driver
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Next.js Application Service (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: digital-student-app-prod
    restart: always
    ports:
      # Expose on localhost only - use reverse proxy (nginx/Caddy) for public access
      - "127.0.0.1:3000:3000"
    environment:
      # Node environment
      NODE_ENV: production

      # MongoDB connection
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/digital-student-onboarding?authSource=admin

      # NextAuth configuration
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}

      # API URL (should match your domain)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

      # Application info
      NEXT_PUBLIC_VERSION: 1.0.0
      NEXT_PUBLIC_NAME: digital-student-registration

      # Production settings
      NEXT_TELEMETRY_DISABLED: 1
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - student_network
    healthcheck:
      test: ["CMD", "./scripts/docker-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Production: Set resource limits
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 1G
    # Production: Enable logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    # Security: Read-only root filesystem (except for temp and cache)
    read_only: false
    # Security: Drop all capabilities except required ones
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  mongo_data_prod:
    name: digital_student_mongo_data_prod
  mongo_config_prod:
    name: digital_student_mongo_config_prod

networks:
  student_network:
    name: digital_student_network_prod
    driver: bridge
